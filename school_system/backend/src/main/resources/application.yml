server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: school-system
  profiles:
    default: demo
  h2:
    console:
      enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB
app:
  storage-root: ${STORAGE_ROOT:./.runtime/files}
  demo-password: ${DEMO_PASSWORD:Demo@2026!}
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
logging:
  level:
    org.springframework.security: INFO
